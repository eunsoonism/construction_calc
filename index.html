<!DOCTYPE html>
<html lang="ko">
<head>
    <link rel="apple-touch-icon" href="calc_icon.png">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Construction Master Pro - Fraction Engine</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            touch-action: manipulation;
            -webkit-user-select: none;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: #1e272e;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            min-height: 100vh;
            padding: 12px;
        }

        .calculator {
            background: linear-gradient(135deg, #f39c12, #d35400);
            width: 92vw;
            max-width: 420px;
            height: 95vh;
            max-height: 880px;
            padding: 16px 14px;
            border-radius: 22px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.6);
            display: flex;
            flex-direction: column;
        }

        .top-grip {
            width: 80px;
            height: 8px;
            background-color: #2c3e50;
            border-radius: 4px;
            margin: 0 auto 10px auto;
            flex-shrink: 0;
        }

        .console {
            background: linear-gradient(135deg, #ecf0f1, #bdc3c7);
            width: 100%;
            height: 100%;
            padding: 12px;
            border-radius: 12px;
            box-shadow: inset 0 2px 4px rgba(0, 0, 0, 0.3);
            display: flex;
            flex-direction: column;
        }

        .branding {
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
            margin-bottom: 6px;
            padding: 0 2px;
            flex-shrink: 0;
        }

        .brand-title {
            font-style: italic;
            font-weight: 800;
            font-size: 1.5rem;
            color: #2c3e50;
        }

        .screen-container {
            background-color: #bdc5b5;
            width: 100%;
            height: 16%;
            min-height: 85px;
            border-radius: 6px;
            border: 3px solid #7f8c8d;
            box-shadow: inset 0 3px 6px rgba(0, 0, 0, 0.4);
            display: flex;
            flex-direction: column;
            justify-content: center;
            padding: 4px 10px;
            margin-bottom: 10px;
            position: relative;
            flex-shrink: 0;
            overflow: hidden;
        }

        .screen-history {
            position: absolute;
            top: 6px;
            right: 10px;
            font-size: 0.72rem;
            font-weight: bold;
            color: #2c3e50;
            max-width: 65%;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            text-align: right;
        }

        .screen-main-wrapper {
            width: 100%;
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
            margin-top: 14px;
            overflow: hidden;
        }

        .screen-label-left {
            font-size: 1.3rem;
            font-weight: bold;
            color: #111;
            white-space: nowrap;
            margin-right: 6px;
            flex-shrink: 0;
        }

        .screen-main {
            font-size: 1.7rem;
            font-weight: bold;
            color: #111;
            white-space: nowrap;
            overflow-x: auto;
            text-align: right;
            flex-grow: 1;
            transition: font-size 0.1s ease;
            -ms-overflow-style: none;
            scrollbar-width: none;
        }

        .screen-main::-webkit-scrollbar {
            display: none;
        }

        .stacked-fraction {
            display: inline-flex;
            flex-direction: column;
            vertical-align: middle;
            text-align: center;
            font-size: 0.6em;
            line-height: 0.9;
            margin: 0 3px;
            position: relative;
            top: -0.05em;
        }

        .stacked-fraction .num {
            border-bottom: 1.8px solid #111;
            padding: 0 2px 1px 2px;
            font-weight: bold;
        }

        .stacked-fraction .den {
            padding: 1px 2px 0 2px;
            font-weight: bold;
        }

        .result-wrapper {
            display: inline-flex;
            align-items: center;
        }

        .keypad {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            grid-template-rows: repeat(9, 1fr);
            gap: 4px;
            width: 100%;
            flex-grow: 1;
        }

        .key-group {
            display: flex;
            flex-direction: column;
            align-items: center;
            height: 100%;
            overflow: hidden;
        }

        .shift-label {
            font-size: 0.75rem;
            font-weight: 750;
            color: #b9770e;
            position: relative;
            top: -3px;
            height: 12px;
            text-align: center;
            white-space: nowrap;
            overflow: visible;
            text-overflow: clip;
            width: 100%;
            flex-shrink: 0;
            letter-spacing: -0.5px;
        }

        button {
            width: 100%;
            height: calc(100% - 13px);
            border: none;
            border-radius: 4px;
            font-size: 0.9rem;
            font-weight: 600;
            cursor: pointer;
            box-shadow: 0 2px 0 rgba(0, 0, 0, 0.3);
            transition: transform 0.01s ease;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        button:active {
            transform: translateY(2px);
            box-shadow: none;
        }

        .btn-dark { background-color: #2c3e50; color: white; }
        .btn-orange { background-color: #e67e22; color: white; }
        .btn-red { background-color: #c0392b; color: white; }
        .btn-light { background-color: #f8f9fa; color: #2c3e50; border: 1px solid #dcdde1; }
        .btn-active { border: 2px solid #f1c40f !important; filter: brightness(1.1); }

        .footer-brand {
            margin-top: 6px;
            text-align: center;
            font-size: 0.55rem;
            font-weight: bold;
            color: #333;
            letter-spacing: 1px;
            text-transform: uppercase;
            flex-shrink: 0;
        }
    </style>
</head>
<body>

<div class="calculator">
    <div class="top-grip"></div>
    
    <div class="console">
        <div class="branding">
            <div>
                <span class="brand-title">Eunsoo Master Pro</span>
            </div>
        </div>

        <div class="screen-container" id="screen-container">
            <div class="screen-history" id="display-history"></div>
            <div class="screen-main-wrapper">
                <div class="screen-label-left" id="display-label"></div>
                <div class="screen-main" id="display-main">0</div>
            </div>
        </div>

        <div class="keypad">
            <!-- Row 1 -->
            <div class="key-group"><span class="shift-label"></span><button class="btn-red" onclick="handleOnClear(event)">On/C</button></div>
            <div class="key-group"><span class="shift-label"></span><button class="btn-dark" style="visibility:hidden;"></button></div>
            <div class="key-group"><span class="shift-label"></span><button class="btn-dark" style="visibility:hidden;"></button></div>
            <div class="key-group"><span class="shift-label"></span><button class="btn-dark" style="visibility:hidden;"></button></div>
            <div class="key-group"><span class="shift-label"></span><button class="btn-dark" style="visibility:hidden;"></button></div>

            <!-- Row 2 -->
            <div class="key-group"><span class="shift-label">Slope</span><button class="btn-dark" onclick="handleDimensionKey('Pitch')">Pitch</button></div>
            <div class="key-group"><span class="shift-label">R/Wall</span><button class="btn-dark" onclick="handleDimensionKey('Rise')">Rise</button></div>
            <div class="key-group"><span class="shift-label">Polygon</span><button class="btn-dark" onclick="handleDimensionKey('Run')">Run</button></div>
            <div class="key-group"><span class="shift-label">Roof</span><button class="btn-dark" onclick="handleDimensionKey('Diag')">Diag</button></div>
            <div class="key-group"><span class="shift-label">Tr/Pitch</span><button class="btn-dark" onclick="calcHipV()">Hip/V</button></div>

            <!-- Row 3 -->
            <div class="key-group"><span class="shift-label">Spring</span><button class="btn-dark">Comp</button></div>
            <div class="key-group"><span class="shift-label">Riser</span><button class="btn-dark" onclick="handleStairButton()">Stair</button></div>
            <div class="key-group"><span class="shift-label">Radius</span><button class="btn-dark" onclick="calcArc()">Arc</button></div>
            <div class="key-group"><span class="shift-label">Column</span><button class="btn-dark">Circ</button></div>
            <div class="key-group"><span class="shift-label">Tr/Jack</span><button class="btn-dark" onclick="calcJack()">Jack</button></div>

            <!-- Row 4 -->
            <div class="key-group"><span class="shift-label"></span><button class="btn-dark" onclick="appendUnit('m')">m</button></div>
            <div class="key-group"><span class="shift-label">Blocks</span><button class="btn-dark" onclick="handleDimensionKey('Length')">Length</button></div>
            <div class="key-group"><span class="shift-label">Footing</span><button class="btn-dark" onclick="handleDimensionKey('Width')">Width</button></div>
            <div class="key-group"><span class="shift-label">Drywall</span><button class="btn-dark" onclick="handleDimensionKey('Height')">Height</button></div>
            <div class="key-group"><span class="shift-label">x²</span><button class="btn-dark" onclick="calcSquare()">x²</button></div>

            <!-- Row 5 -->
            <div class="key-group"><span class="shift-label"></span><button class="btn-dark" onclick="handleUnitKey('yds')">Yds</button></div>
            <div class="key-group"><span class="shift-label"></span><button class="btn-dark" onclick="handleUnitKey('feet')">Feet</button></div>
            <div class="key-group"><span class="shift-label"></span><button class="btn-dark" onclick="handleUnitKey('inch')">Inch</button></div>
            <div class="key-group"><span class="shift-label"></span><button class="btn-dark" onclick="appendFractionInput('/')">/</button></div>
            <div class="key-group"><span class="shift-label">√x</span><button class="btn-dark" onclick="backspace()">←</button></div>

            <!-- Row 6 -->
            <div class="key-group"><span class="shift-label">Prefs</span><button class="btn-orange" id="btn-conv" onclick="toggleConv()">Conv</button></div>
            <div class="key-group"><span class="shift-label">cm Riser</span><button class="btn-light" onclick="appendNum('7')">7</button></div>
            <div class="key-group"><span class="shift-label">Bd Ft</span><button class="btn-light" onclick="appendNum('8')">8</button></div>
            <div class="key-group"><span class="shift-label">mm Tread</span><button class="btn-light" onclick="appendNum('9')">9</button></div>
            <div class="key-group"><span class="shift-label">1/x</span><button class="btn-dark" onclick="appendInput(' / ')">÷</button></div>

            <!-- Row 7 -->
            <div class="key-group"><span class="shift-label">Stor</span><button class="btn-dark" onclick="storeVal()">Stor</button></div>
            <div class="key-group"><span class="shift-label">lbs Blk</span><button class="btn-light" onclick="appendNum('4')">4</button></div>
            <div class="key-group"><span class="shift-label">Studs</span><button class="btn-light" onclick="appendNum('5')">5</button></div>
            <div class="key-group"><span class="shift-label">tons Ftg</span><button class="btn-light" onclick="appendNum('6')">6</button></div>
            <div class="key-group"><span class="shift-label">Clear</span><button class="btn-dark" onclick="appendInput(' * ')">×</button></div>

            <!-- Row 8 -->
            <div class="key-group"><span class="shift-label">M-R/C</span><button class="btn-dark" onclick="recallVal()">Rcl</button></div>
            <div class="key-group"><span class="shift-label">kg M1</span><button class="btn-light" onclick="appendNum('1')">1</button></div>
            <div class="key-group"><span class="shift-label">Acre M2</span><button class="btn-light" onclick="appendNum('2')">2</button></div>
            <div class="key-group"><span class="shift-label">met tons</span><button class="btn-light" onclick="appendNum('3')">3</button></div>
            <div class="key-group"><span class="shift-label">+/-</span><button class="btn-dark" onclick="appendInput(' - ')">−</button></div>

            <!-- Row 9 -->
            <div class="key-group"><span class="shift-label">M-</span><button class="btn-dark" onclick="memPlus()">M+</button></div>
            <div class="key-group"><span class="shift-label">Cost</span><button class="btn-light" onclick="appendNum('0')">0</button></div>
            <div class="key-group"><span class="shift-label">dms</span><button class="btn-light" onclick="appendNum('.')">.</button></div>
            <div class="key-group"><span class="shift-label">Tape</span><button class="btn-dark" onclick="calculateResult()">=</button></div>
            <div class="key-group"><span class="shift-label"></span><button class="btn-dark" onclick="appendInput(' + ')">+</button></div>
        </div>

        <div class="footer-brand">Calculated Industries (3-Way Toggle Edition)</div>
    </div>
</div>

<script>
    let currentInput = "0";
    let activeMode = "STANDBY";
    let currentLabel = "";
    let memory = 0;
    let historyInput = ""; 
    
    let isConvActive = false;
    let memoryValues = { Pitch: 0, Rise: 0, Run: 0, Diag: 0, HipV: 0, Length: 0, Width: 0, Height: 0 };
    let dimEntryHistory = []; // Pitch/Rise/Run/Diag 중 최근에 "새로 입력"된 값 2개 순서 기록
    
    let jackSpacing = 406;
    let jackList = [];
    let jackIndex = -1;

    let stairData = null;
    let stairStep = 0;
    let hipVState = 0; 

    let desiredRiserHeight = 190.5;   
    let desiredTreadWidth = 254;      
    let stairHeadroom = 2032;         
    let stairFloorThickness = 254;    

    let awaitingStoreSlot = false;
    let awaitingRecallSlot = false;
    let pendingStoreValue = 0;
    let isCalculatedState = false;

    let clearClickCount = 0;
    let clearClickTimer = null;

    // --- mm/inch/feet/yds 단위 변환용 (Conv 연동) ---
    let dimValueMM = null;   // 현재 화면 숫자의 실제 값(mm 기준, 내부 전용)
    let dimEntryUnit = null; // 현재 화면에 표시 중인 단위

    // --- Arc(호) 계산용 ---
    let radiusVal = null;        // Ç+Arc로 계산/저장된 반지름 (Run/Rise와 동일한 내부 스케일)
    let arcAngleDeg = null;      // 계산된 중심각(도)
    let arcCycleState = 0;       // Arc 키를 계속 누를 때 다음에 보여줄 값의 순서
    let arcDisplayUnit = 'bare'; // Run/Rise를 입력할 때 감지된 단위: 'bare'(단위 없음)/'inch'/'feet'/'mm'/'cm'/'m'/'yds'
    let arcJustCycled = false;   // 방금 화면에 표시된 값이 Arc(반지름/각도/호길이) 자체의 계산 결과인지 표시.
                                  // 이게 true면 Conv+Arc를 눌러도 그 화면 값을 "새로 입력한 반지름"으로 오인하지 않는다.

    function formatVal(val) {
        if (isNaN(val)) return "0";
        let rounded = Math.round(val * 100) / 100;
        return Number(rounded).toString();
    }

    function formatInchToStacked(totalInches) {
        if (isNaN(totalInches)) return "0 in";
        let sign = totalInches < 0 ? "-" : "";
        let absVal = Math.abs(totalInches);
        
        let whole = Math.floor(absVal);
        let rem = absVal - whole;
        
        let sixteenths = Math.round(rem * 16);
        if (sixteenths === 16) {
            whole += 1;
            sixteenths = 0;
        }

        if (sixteenths === 0) {
            return `${sign}${whole} in`;
        }

        let num = sixteenths;
        let den = 16;
        while (num % 2 === 0 && den % 2 === 0) {
            num /= 2;
            den /= 2;
        }

        let fracHtml = `<span class="stacked-fraction"><span class="num">${num}</span><span class="den">${den}</span></span>`;

        if (whole === 0) {
            return `<span class="result-wrapper">${sign}${fracHtml} in</span>`;
        } else {
            return `<span class="result-wrapper">${sign}${whole}${fracHtml} in</span>`;
        }
    }

    // --- mm / inch / feet / yds 상호 변환 (Conv 연동, 신규) ---
    const UNIT_FACTORS_MM = { mm: 1, inch: 25.4, feet: 304.8, yds: 914.4 };

    function parseSimpleNumber(str) {
        // 단순 숫자 또는 "3/4", "1 3/4" 형태의 분수 하나만 해석 (복합 feet-inch 문자열은 대상 아님)
        let s = (str || "").toString().trim();
        if (!s || s === "0") return 0;
        let mixed = s.match(/^(-?\d+)\s+(\d+)\s*\/\s*(\d+)$/);
        if (mixed) return parseInt(mixed[1], 10) + parseInt(mixed[2], 10) / parseInt(mixed[3], 10);
        let frac = s.match(/^(-?\d+)\s*\/\s*(\d+)$/);
        if (frac) return parseInt(frac[1], 10) / parseInt(frac[2], 10);
        let f = parseFloat(s.replace(/[^0-9.\-]/g, ''));
        return isNaN(f) ? 0 : f;
    }

    function formatFraction16Html(sixteenths) {
        let num = sixteenths, den = 16;
        while (num % 2 === 0 && den % 2 === 0) { num /= 2; den /= 2; }
        return `<span class="stacked-fraction"><span class="num">${num}</span><span class="den">${den}</span></span>`;
    }

    function formatWholeFracInch(v) {
        // v: 인치 단위의 소수 값 -> "3", "3<3/4분수>" 같은 HTML 반환 (inch 글자는 붙이지 않음)
        let sign = v < 0 ? "-" : "";
        let a = Math.abs(v);
        let whole = Math.floor(a + 1e-9);
        let sixteenths = Math.round((a - whole) * 16);
        if (sixteenths === 16) { sixteenths = 0; whole += 1; }
        let fracHtml = sixteenths !== 0 ? formatFraction16Html(sixteenths) : '';
        return `${sign}${whole}${fracHtml}`;
    }

    function mmToSimpleUnitDisplay(mm, unit) {
        let v = mm / UNIT_FACTORS_MM[unit];
        if (unit === 'inch') return formatWholeFracInch(v) + 'inch';
        return `${formatVal(v)}${unit}`;
    }

    function mmToFeetDisplay(mm) {
        let sign = mm < 0 ? "-" : "";
        let totalInch = Math.abs(mm) / 25.4;
        let feet = Math.floor(totalInch / 12 + 1e-9);
        let remInch = totalInch - feet * 12;
        let whole = Math.floor(remInch + 1e-9);
        let sixteenths = Math.round((remInch - whole) * 16);
        if (sixteenths === 16) { sixteenths = 0; whole += 1; }
        if (whole === 12) { whole = 0; feet += 1; }
        let fracHtml = sixteenths !== 0 ? formatFraction16Html(sixteenths) : '';
        let inchPart = `${whole}${fracHtml}inch`;
        return feet !== 0 ? `${sign}${feet}F ${inchPart}` : `${sign}${inchPart}`;
    }

    // --- Arc(호) 계산 전용: Run/Rise 입력 시 어떤 단위를 썼는지 감지하고,
    // 계산 결과를 그 단위 그대로(또는 단위 없이) 돌려주기 위한 헬퍼 ---
    function detectUnitFromRaw(raw) {
        let s = stripDisplayHtml(raw || "").trim();
        if (/\d\s*\/\s*\d/.test(s) || /inch|in\b/i.test(s)) return 'inch';
        if (/ft\b|feet/i.test(s)) return 'feet';
        if (/mm/i.test(s)) return 'mm';
        if (/cm/i.test(s)) return 'cm';
        if (/yds/i.test(s)) return 'yds';
        if (/\bm\b/i.test(s) && !/mm/i.test(s)) return 'm';
        return 'bare';
    }

    // Run/Rise가 저장된 것과 동일한 내부 스케일의 "길이"값을 arcDisplayUnit에 맞춰 표시
    function formatArcLength(val) {
        switch (arcDisplayUnit) {
            case 'inch': return mmToSimpleUnitDisplay(val, 'inch');
            case 'feet': return mmToFeetDisplay(val);
            case 'mm': return `${formatVal(val)}mm`;
            case 'cm': return `${formatVal(val / 10)}cm`;
            case 'm': return `${formatVal(val / 1000)}m`;
            case 'yds': return `${formatVal(val / 914.4)}yds`;
            default: return `${formatVal(val)}`; // 'bare': 단위 없이 숫자 그대로
        }
    }

    // 위와 동일한 스케일의 "넓이"값(길이²) 표시
    function formatArcArea(val) {
        switch (arcDisplayUnit) {
            case 'inch': return `${formatVal(val / (25.4 * 25.4))} sq in`;
            case 'feet': return `${formatVal(val / (304.8 * 304.8))} sq ft`;
            case 'mm': return `${formatVal(val)} sq mm`;
            case 'cm': return `${formatVal(val / 100)} sq cm`;
            case 'm': return `${formatVal(val / 1e6)} sq m`;
            case 'yds': return `${formatVal(val / (914.4 * 914.4))} sq yd`;
            default: return `${formatVal(val)}`; // 'bare': 단위 없이 숫자 그대로
        }
    }

    // Feet / Inch / Yds 키, 그리고 Conv+9(mm)에서 공통으로 호출
    function handleUnitKey(unit) {
        historyInput = "";

        // Conv는 "화면에 표시된 값 전체"를 다른 단위로 바꾸는 기능이므로,
        // 사칙연산 도중(예: "6in + " 까지만 입력된 상태)에 Conv+단위를 누르면
        // 아직 완성되지 않은 수식 전체를 값 하나로 잘못 해석해서 계산이 깨진다.
        // 그래서 수식에 연산자가 이미 섞여 있을 때는 값 전체를 변환하지 않고
        // 아래 일반 입력 로직(마지막 숫자에 단위만 붙이는 방식)으로 넘어가게 한다.
        // 주의: "3/4" 같은 분수의 '/'는 연산자가 아니므로 제외해야 한다.
        // 실제 사칙연산 기호는 버튼 입력 시 항상 앞뒤에 공백이 붙어서 들어온다
        // (예: "12 + 6", "12 / 4"). 분수는 공백 없이 붙어 있으므로(예: "3/4")
        // 앞뒤에 공백이 있는 연산자만 "계산 진행 중"으로 판단한다.
        let hasOperatorInProgress = /\s[+\-*/]\s/.test(stripDisplayHtml(currentInput));
        if (isConvActive && !hasOperatorInProgress) {
            // Conv 다음에 단위 키를 누르면, 지금 화면에 있는 값(직접 입력한 값이든
            // 사칙연산 계산 결과든 상관없이)을 mm 기준값으로 환산한 뒤 원하는 단위로 다시 표시한다.
            // 화면 텍스트는 1/16인치 등으로 반올림되어 있을 수 있으므로, 방금 계산되었거나
            // 이전에 Conv로 변환된 "정확한 mm값"이 남아있다면(dimValueMM) 그 값을 우선
            // 사용해서 반올림 오차가 누적되지 않게 한다. 그런 값이 없을 때만(예: 사용자가
            // 직접 타이핑한 값) 화면 텍스트를 다시 해석한다.
            let mmVal = (dimValueMM !== null) ? dimValueMM : parseUnitTermToMM(currentInput);
            currentInput = (unit === 'feet')
                ? mmToFeetDisplay(mmVal)
                : mmToSimpleUnitDisplay(mmVal, unit);
            dimValueMM = mmVal;
            dimEntryUnit = unit;
            currentLabel = "";
            isConvActive = false;
            isCalculatedState = true; // 변환 결과는 확정된 값이므로 다음 숫자는 새로 시작
            updateDisplay();
            return;
        }
        isConvActive = false;

        // 새 값 입력: 마지막으로 입력 중이던(아직 단위가 안 붙은) 숫자에만 단위를 붙인다.
        // 이렇게 해야 "2ft 4in"이나 "2in 3/4"처럼 앞서 입력한 부분이 사라지지 않고
        // 계속 이어서 입력할 수 있다.
        let full = currentInput.trim();
        let segments = (full === "0" || full === "") ? [] : full.split(/\s+/);
        let lastSeg = segments.length > 0 ? segments[segments.length - 1] : "0";
        let isPending = lastSeg !== "" && !/[a-zA-Z]/.test(lastSeg);

        if (isPending && segments.length > 0) {
            segments.pop();
        } else if (!isPending) {
            // 마지막 조각에 이미 단위가 붙어 있다면(예: 같은 단위 버튼을 연속 클릭) 0으로 새 조각 시작
            lastSeg = "0";
        }

        let n = parseSimpleNumber(lastSeg);
        let unitAbbr = (unit === 'feet') ? 'ft' : (unit === 'inch') ? 'in' : unit;
        let formattedSeg = (unit === 'inch') ? (formatWholeFracInch(n) + unitAbbr) : `${formatVal(n)}${unitAbbr}`;
        segments.push(formattedSeg);
        currentInput = segments.join(' ');

        dimValueMM = null;
        dimEntryUnit = unit;
        currentLabel = "";
        isConvActive = false;
        isCalculatedState = false; // 계속 이어서 입력할 수 있도록 유지 (복합 단위 입력)
        updateDisplay();
    }


    // HTML로 표시된 스택 분수(예: 결과 표시)를 다시 순수 텍스트 "num/den" 형태로 되돌린다.
    // 스택 분수는 화면상 CSS margin으로만 앞 숫자와 떨어져 보일 뿐 실제 공백 문자가 없으므로,
    // 변환 시 반드시 공백을 넣어줘야 "3 1/4"가 "31/4"로 합쳐지는 걸 막을 수 있다.
    function stripDisplayHtml(str) {
        return (str || "")
            .replace(/<span class="stacked-fraction"><span class="num">(\d+)<\/span><span class="den">(\d+)<\/span><\/span>/g, ' $1/$2')
            .replace(/<[^>]+>/g, '');
    }

    // 하나의 "항(term)"을 해석해서 mm 값으로 반환.
    // - "12mm", "5cm", "1.5m", "3yds" 같은 단순 단위
    // - "2ft 4in", "2ft" 같은 feet+inch 복합 입력
    // - "2in 3/4", "3/4" 같은 inch(+분수) 입력
    // - 단위가 전혀 없는 숫자는 이 앱의 기본 단위인 mm로 취급
    function parseUnitTermToMM(token) {
        let s = stripDisplayHtml(token).trim();
        if (!s) return 0;

        // feet 부분 분리 (예: "2ft 4in" -> feet=2, 나머지="4in")
        // 화면에 계산 결과를 표시할 때는 "2F 4in"처럼 "F" 축약 표기를 쓰므로
        // (mmToFeetDisplay 참고), Conv로 그 결과값을 다시 읽어들일 수 있도록
        // "ft"/"feet"뿐 아니라 "F" 표기도 함께 인식해야 한다.
        let feetMatch = s.match(/(-?\d+(?:\.\d+)?)\s*(?:ft|feet|F)\b/i);
        if (feetMatch) {
            let feetVal = parseFloat(feetMatch[1]);
            let remainder = (s.slice(0, feetMatch.index) + ' ' + s.slice(feetMatch.index + feetMatch[0].length)).trim();
            let inchVal = remainder ? parseInchesExpression(remainder) : 0;
            if (!Number.isFinite(inchVal)) inchVal = 0;
            return (feetVal * 12 + inchVal) * 25.4;
        }

        if (/mm/i.test(s)) return parseFloat(s.replace(/[^0-9.\-]/g, '')) || 0;
        if (/cm/i.test(s)) return (parseFloat(s.replace(/[^0-9.\-]/g, '')) || 0) * 10;
        if (/yds/i.test(s)) return (parseFloat(s.replace(/[^0-9.\-]/g, '')) || 0) * 914.4;
        if (/\bm\b/i.test(s) && !/mm/i.test(s)) return (parseFloat(s.replace(/[^0-9.\-]/g, '')) || 0) * 1000;
        if (/in|inch/i.test(s) || /\d\s*\/\s*\d/.test(s)) {
            let inchVal = parseInchesExpression(s);
            return Number.isFinite(inchVal) ? inchVal * 25.4 : 0;
        }

        return parseFloat(s.replace(/[^0-9.\-]/g, '')) || 0;
    }

    function parseValue(str) {
        if (!str) return 0;
        let raw = str.toString().trim();
        let s = raw.toUpperCase();
        if (s === "0" || s.includes("STORED") || s.includes("ERR") || s.includes("NO JACKS") || s.includes("RISERS") || s.includes("O.C.")) {
            return 0;
        }
        return parseUnitTermToMM(raw);
    }

    function adjustFontSize() {
        let main = document.getElementById("display-main");
        let rawText = main.innerText || main.textContent || "";
        let len = rawText.length;

        if (len > 22) {
            main.style.fontSize = "1.0rem";
        } else if (len > 16) {
            main.style.fontSize = "1.25rem";
        } else if (len > 12) {
            main.style.fontSize = "1.45rem";
        } else {
            main.style.fontSize = "1.7rem";
        }

        main.scrollLeft = main.scrollWidth;
    }

    function updateDisplay() {
        let displayElem = document.getElementById("display-main");
        displayElem.innerHTML = currentInput; 

        let labelElem = document.getElementById("display-label");
        labelElem.innerText = currentLabel;

        document.getElementById("display-history").innerText = historyInput; 

        let convBtn = document.getElementById("btn-conv");
        if (isConvActive) {
            convBtn.classList.add("btn-active");
        } else {
            convBtn.classList.remove("btn-active");
        }

        adjustFontSize();
    }

    function toggleConv() {
        isConvActive = !isConvActive;
        updateDisplay();
    }

    function appendUnit(targetUnit) {
        historyInput = ""; 
        let current = currentInput.trim();
        
        if (current === "0" || current.includes("ERR") || current.includes("STORED")) {
            currentInput = `0 ${targetUnit}`;
        } else {
            currentInput = `${current} ${targetUnit}`;
        }
        
        isConvActive = false;
        isCalculatedState = false;
        updateDisplay();
    }

    function appendNum(num) {
        if (awaitingStoreSlot) {
            awaitingStoreSlot = false;
            historyInput = "";
            if (num === '7') {
                desiredRiserHeight = pendingStoreValue > 0 ? pendingStoreValue : desiredRiserHeight;
                currentLabel = "R-HT";
                currentInput = `${formatVal(desiredRiserHeight)} mm`;
            } else if (num === '9') {
                desiredTreadWidth = pendingStoreValue > 0 ? pendingStoreValue : desiredTreadWidth;
                currentLabel = "T-WD";
                currentInput = `${formatVal(desiredTreadWidth)} mm`;
            } else {
                memory = pendingStoreValue;
                currentLabel = "";
                currentInput = "STORED";
                setTimeout(() => {
                    currentInput = formatVal(memory);
                    updateDisplay();
                }, 800);
            }
            isCalculatedState = true;
            updateDisplay();
            return;
        }

        if (awaitingRecallSlot) {
            awaitingRecallSlot = false;
            historyInput = "";
            if (num === '7') {
                currentLabel = "R-HT";
                currentInput = `${formatVal(desiredRiserHeight)} mm`;
            } else if (num === '9') {
                currentLabel = "T-WD";
                currentInput = `${formatVal(desiredTreadWidth)} mm`;
            } else {
                currentLabel = "RCL";
                currentInput = formatVal(memory);
            }
            isCalculatedState = true;
            updateDisplay();
            return;
        }

        if (isConvActive) {
            if (num === '5') {
                let val = parseValue(currentInput);
                currentLabel = "O.C.";
                if (val > 0) {
                    jackSpacing = val;
                    currentInput = `${formatVal(val)} mm`;
                } else {
                    currentInput = `406 mm`;
                }
                isConvActive = false;
                isCalculatedState = true;
                updateDisplay();
                
                setTimeout(() => {
                    if (currentLabel === "O.C.") {
                        currentLabel = "";
                        currentInput = "0";
                        isCalculatedState = false;
                        updateDisplay();
                    }
                }, 1000);
                return;
            } else if (num === '9') {
                handleUnitKey('mm');
                return;
            }
            isConvActive = false;
        }

        if (isCalculatedState) {
            currentInput = num;
            currentLabel = "";
            historyInput = "";
            isCalculatedState = false;
            dimValueMM = null;
            dimEntryUnit = null;
            arcJustCycled = false;
        } else {
            if (currentInput === "0" || currentInput.includes("ERR") || currentInput.includes("O.C.")) {
                currentInput = num;
            } else {
                let trimmed = currentInput.trim();
                let lastChar = trimmed.slice(-1);
                if (/[a-zA-Z]/.test(lastChar)) {
                    currentInput = trimmed + " " + num;
                } else {
                    currentInput += num;
                }
            }
        }
        updateDisplay();
    }

    function appendInput(val) {
        isConvActive = false;
        isCalculatedState = false;
        currentInput += val;
        updateDisplay();
    }

    function appendFractionInput(val) {
        isConvActive = false;
        isCalculatedState = false;
        
        let current = currentInput.trim();
        if (current !== "0" && !current.endsWith(" ") && !current.endsWith("/")) {
            currentInput += " ";
        }
        currentInput += val;
        updateDisplay();
    }

    function handleOnClear(event) {
        if (event) {
            event.preventDefault();
            event.stopPropagation();
        }

        clearClickCount++;

        if (clearClickCount === 1) {
            currentInput = "0";
            currentLabel = "";
            historyInput = "";
            isConvActive = false;
            isCalculatedState = false;
            awaitingStoreSlot = false;
            awaitingRecallSlot = false;
            dimValueMM = null;
            dimEntryUnit = null;
            updateDisplay();

            clearTimeout(clearClickTimer);
            clearClickTimer = setTimeout(() => {
                clearClickCount = 0;
            }, 1000);
        } else if (clearClickCount >= 2) {
            clearTimeout(clearClickTimer);
            clearClickCount = 0;
            clearAll();
        }
    }

    function clearAll(event) {
        if (event) {
            event.preventDefault();
            event.stopPropagation();
        }
        isConvActive = false;
        historyInput = "";
        activeMode = "STANDBY";
        isCalculatedState = false;
        
        memoryValues = { Pitch: 0, Rise: 0, Run: 0, Diag: 0, HipV: 0, Length: 0, Width: 0, Height: 0 };
        dimEntryHistory = [];
        jackSpacing = 406;
        jackList = [];
        jackIndex = -1;
        stairData = null;
        stairStep = 0;
        hipVState = 0;
        radiusVal = null;
        arcAngleDeg = null;
        arcCycleState = 0;
        arcDisplayUnit = 'bare';
        arcJustCycled = false;
        awaitingStoreSlot = false;
        awaitingRecallSlot = false;
        dimValueMM = null;
        dimEntryUnit = null;

        currentLabel = "O.C.";
        currentInput = "406 mm";
        updateDisplay();

        setTimeout(() => {
            if (currentLabel === "O.C." && currentInput === "406 mm") {
                currentLabel = "";
                currentInput = "0";
                updateDisplay();
            }
        }, 1000);
    }

    function backspace() {
        isConvActive = false;
        if (currentInput.length > 1) {
            currentInput = currentInput.trim().slice(0, -1);
            if (currentInput === "" || currentInput === "-") currentInput = "0";
        } else {
            currentInput = "0";
        }
        updateDisplay();
    }

    // Pitch/Rise/Run/Diag 중 "가장 최근에 새로 입력된 두 값"을 기준으로 나머지 값들을 계산
    function recalcFromPair(a, b) {
        let has = (n) => (a === n || b === n);
        if (has('Run') && has('Pitch')) {
            let angleRad = memoryValues.Pitch * (Math.PI / 180);
            memoryValues.Rise = memoryValues.Run * Math.tan(angleRad);
            memoryValues.Diag = Math.sqrt(Math.pow(memoryValues.Rise, 2) + Math.pow(memoryValues.Run, 2));
        } else if (has('Run') && has('Rise')) {
            let angleRad = Math.atan(memoryValues.Rise / memoryValues.Run);
            memoryValues.Pitch = angleRad * (180 / Math.PI);
            memoryValues.Diag = Math.sqrt(Math.pow(memoryValues.Rise, 2) + Math.pow(memoryValues.Run, 2));
        } else if (has('Diag') && has('Pitch')) {
            let angleRad = memoryValues.Pitch * (Math.PI / 180);
            memoryValues.Run = memoryValues.Diag * Math.cos(angleRad);
            memoryValues.Rise = memoryValues.Diag * Math.sin(angleRad);
        } else if (has('Diag') && has('Rise')) {
            memoryValues.Run = Math.sqrt(Math.max(0, Math.pow(memoryValues.Diag, 2) - Math.pow(memoryValues.Rise, 2)));
            let angleRad = Math.asin(memoryValues.Rise / memoryValues.Diag);
            memoryValues.Pitch = angleRad * (180 / Math.PI);
        } else if (has('Run') && has('Diag')) {
            memoryValues.Rise = Math.sqrt(Math.max(0, Math.pow(memoryValues.Diag, 2) - Math.pow(memoryValues.Run, 2)));
            let angleRad = Math.acos(memoryValues.Run / memoryValues.Diag);
            memoryValues.Pitch = angleRad * (180 / Math.PI);
        } else if (has('Rise') && has('Pitch')) {
            let angleRad = memoryValues.Pitch * (Math.PI / 180);
            memoryValues.Run = memoryValues.Rise / Math.tan(angleRad);
            memoryValues.Diag = Math.sqrt(Math.pow(memoryValues.Rise, 2) + Math.pow(memoryValues.Run, 2));
        }
    }

    // modeName을 "방금 새로 입력된 값"으로 recency 기록에 반영
    function pushDimEntry(modeName) {
        dimEntryHistory = dimEntryHistory.filter(n => n !== modeName);
        dimEntryHistory.push(modeName);
        if (dimEntryHistory.length > 2) dimEntryHistory.shift();
        if (dimEntryHistory.length === 2) {
            recalcFromPair(dimEntryHistory[0], dimEntryHistory[1]);
        }
    }

    function handleDimensionKey(modeName) {
        isConvActive = false;
        historyInput = "";

        if (awaitingStoreSlot) {
            awaitingStoreSlot = false;
            let valToStore = pendingStoreValue > 0 ? pendingStoreValue : parseValue(currentInput);
            memoryValues[modeName] = valToStore;
            activeMode = modeName;
            currentLabel = modeName;
            if (modeName === 'Pitch') {
                currentInput = `${formatVal(memoryValues.Pitch)}°`;
            } else if (modeName === 'Rise' || modeName === 'Run' || modeName === 'Diag' || modeName === 'Length' || modeName === 'Width' || modeName === 'Height') {
                currentInput = `${formatVal(memoryValues[modeName])} mm`;
            } else {
                currentInput = `${formatVal(memoryValues[modeName])}`;
            }
            isCalculatedState = true;
            updateDisplay();
            return;
        }

        if (awaitingRecallSlot) {
            awaitingRecallSlot = false;
            activeMode = modeName;
            currentLabel = modeName;
            let storedVal = memoryValues[modeName];
            if (modeName === 'Pitch') {
                currentInput = `${formatVal(storedVal)}°`;
            } else if (modeName === 'Rise' || modeName === 'Run' || modeName === 'Diag' || modeName === 'Length' || modeName === 'Width' || modeName === 'Height') {
                currentInput = `${formatVal(storedVal)} mm`;
            } else {
                currentInput = `${formatVal(storedVal)}`;
            }
            isCalculatedState = true;
            updateDisplay();
            return;
        }

        let val = parseValue(currentInput);
        let enteredUnit = detectUnitFromRaw(currentInput);
        let hasNewInput = (currentInput !== "0" && !currentInput.includes("°") && !currentInput.includes("mm") && !currentInput.includes("ERR") && val > 0);

        if (hasNewInput) {
            memoryValues[modeName] = val;
            activeMode = modeName;
            jackList = [];
            jackIndex = -1;
            stairData = null;
            stairStep = 0;
            hipVState = 0;

            if (modeName === 'Run' || modeName === 'Rise') {
                arcDisplayUnit = enteredUnit;
                radiusVal = null;
                arcAngleDeg = null;
                arcCycleState = 0;
                arcJustCycled = false;
            }

            if (modeName === 'Pitch' || modeName === 'Rise' || modeName === 'Run' || modeName === 'Diag') {
                pushDimEntry(modeName);
            }

            currentLabel = modeName;
            if (modeName === 'Pitch') {
                currentInput = `${formatVal(memoryValues.Pitch)}°`;
            } else if (modeName === 'Rise' || modeName === 'Run' || modeName === 'Diag' || modeName === 'Length' || modeName === 'Width' || modeName === 'Height') {
                currentInput = `${formatVal(memoryValues[modeName])} mm`;
            } else {
                currentInput = `${formatVal(val)}`;
            }
        } else {
            activeMode = modeName;
            currentLabel = modeName;
            let storedVal = memoryValues[modeName];
            if (modeName === 'Pitch') {
                currentInput = `${formatVal(storedVal)}°`;
            } else if (modeName === 'Rise' || modeName === 'Run' || modeName === 'Diag' || modeName === 'Length' || modeName === 'Width' || modeName === 'Height') {
                currentInput = `${formatVal(storedVal)} mm`;
            } else {
                currentInput = `${formatVal(storedVal)}`;
            }
        }
        isCalculatedState = true;
        updateDisplay();
    }

    function calcHipV() {
        isConvActive = false;
        historyInput = "";
        if (memoryValues.Rise <= 0 && memoryValues.Run > 0 && memoryValues.Pitch > 0) {
            let angleRad = memoryValues.Pitch * (Math.PI / 180);
            memoryValues.Rise = memoryValues.Run * Math.tan(angleRad);
        }

        if (memoryValues.Run > 0 && memoryValues.Pitch > 0) {
            let rise = memoryValues.Rise;
            let run = memoryValues.Run;

            let hipRun = run * Math.SQRT2;
            let hipPitchRad = Math.atan(rise / hipRun);
            let hipPitchDeg = hipPitchRad * (180 / Math.PI);
            let hipLength = Math.sqrt(Math.pow(rise, 2) + Math.pow(hipRun, 2));

            if (activeMode !== 'HipV') {
                activeMode = 'HipV';
                hipVState = 0;
            }

            if (hipVState === 0) {
                memoryValues.HipV = hipLength;
                currentLabel = "Hip/V";
                currentInput = `${formatVal(hipLength)} mm`;
                hipVState = 1;
            } else if (hipVState === 1) {
                let plumbCutVal = hipPitchDeg;
                currentLabel = "Plumb";
                currentInput = `${formatVal(plumbCutVal)}°`;
                hipVState = 2;
            } else if (hipVState === 2) {
                let levelCutVal = 90 - hipPitchDeg;
                currentLabel = "Level";
                currentInput = `${formatVal(levelCutVal)}°`;
                hipVState = 0;
            }
        } else {
            currentLabel = "ERR";
            currentInput = "NEED RUN/PITCH";
        }
        isCalculatedState = true;
        updateDisplay();
    }

    // Ç + Arc : Run(현의 길이)과 Rise(세그먼트 높이)로 반지름을 계산 (또는 직접 입력된 반지름을 그대로 사용)
    function calcRadius() {
        historyInput = "";
        let directVal = parseValue(currentInput);
        // arcJustCycled가 true라는 건 지금 화면에 있는 값이 방금 Arc 기능 자신이 보여준
        // 반지름/각도/호 길이 결과라는 뜻이므로, 이걸 사용자가 새로 입력한 반지름으로
        // 착각해서 재사용하면 안 된다. 이 경우엔 항상 Run/Rise로 다시 계산한다.
        let hasDirectInput = !arcJustCycled && (currentInput !== "0" && !currentInput.includes("mm") && !currentInput.includes("°") && !currentInput.includes("ERR") && directVal > 0);

        if (hasDirectInput) {
            arcDisplayUnit = detectUnitFromRaw(currentInput);
            radiusVal = directVal;
        } else {
            let run = memoryValues.Run, rise = memoryValues.Rise;
            if (!(run > 0 && rise > 0)) {
                currentLabel = "ERR";
                currentInput = "NEED RUN/RISE";
                isCalculatedState = true;
                arcJustCycled = false;
                updateDisplay();
                return;
            }
            radiusVal = rise / 2 + (run * run) / (8 * rise);
        }

        let run = memoryValues.Run, rise = memoryValues.Rise;
        if (run > 0 && radiusVal > 0) {
            let ratio = Math.max(-1, Math.min(1, run / (2 * radiusVal)));
            arcAngleDeg = 2 * Math.asin(ratio) * (180 / Math.PI);
        } else {
            arcAngleDeg = null;
        }
        arcCycleState = 0;

        currentLabel = "RAD";
        currentInput = formatArcLength(radiusVal);
        arcJustCycled = true;
        isCalculatedState = true;
        updateDisplay();
    }

    // Arc : Conv+Arc로 반지름을 구한 뒤, Arc 키를 누르면 각도 -> 호 길이 두 가지만 순환 표시
    function calcArc() {
        if (isConvActive) {
            isConvActive = false;
            calcRadius();
            return;
        }
        historyInput = "";

        if (!(radiusVal > 0)) {
            currentLabel = "ERR";
            currentInput = "NEED RADIUS (Conv+Arc)";
            isCalculatedState = true;
            updateDisplay();
            return;
        }

        let angleRad = (arcAngleDeg || 0) * (Math.PI / 180);

        const steps = [
            () => { currentLabel = "ARC"; currentInput = `${formatVal(arcAngleDeg)}°`; },
            () => { currentLabel = "ARC"; currentInput = formatArcLength(radiusVal * angleRad); },
        ];

        if (arcAngleDeg === null || isNaN(arcAngleDeg)) {
            currentLabel = "ERR";
            currentInput = "NEED RUN VALUE";
            isCalculatedState = true;
            updateDisplay();
            return;
        }

        steps[arcCycleState]();
        arcCycleState = (arcCycleState + 1) % steps.length;
        arcJustCycled = true;
        isCalculatedState = true;
        updateDisplay();
    }

    function calcJack() {
        isConvActive = false;
        historyInput = "";
        if (memoryValues.Run > 0 && memoryValues.Pitch > 0) {
            if (jackList.length === 0) {
                let angleRad = memoryValues.Pitch * (Math.PI / 180);
                let currentRun = memoryValues.Run - jackSpacing;
                
                while (currentRun > 0) {
                    let jackDiag = currentRun / Math.cos(angleRad);
                    jackList.push(formatVal(jackDiag));
                    currentRun -= jackSpacing;
                }
            }

            if (jackList.length > 0) {
                jackIndex = (jackIndex + 1) % jackList.length;
                currentLabel = `Jack ${jackIndex + 1}`;
                currentInput = `${jackList[jackIndex]} mm`;
            } else {
                currentLabel = "";
                currentInput = "NO JACKS";
            }
        } else {
            currentLabel = "ERR";
            currentInput = "NEED PITCH";
        }
        isCalculatedState = true;
        updateDisplay();
    }

    function calcStairAuto(limited) {
        let rise = memoryValues.Rise > 0 ? memoryValues.Rise : parseValue(currentInput);
        if (!(rise > 0)) {
            currentLabel = "ERR";
            currentInput = "NEED RISE";
            stairData = null;
            isCalculatedState = true;
            updateDisplay();
            return;
        }
        memoryValues.Rise = rise;

        let run = memoryValues.Run > 0 ? memoryValues.Run : 0;

        let risers = limited
            ? Math.ceil(rise / desiredRiserHeight)
            : Math.round(rise / desiredRiserHeight);
        if (risers < 1) risers = 1;

        let actualRiserHeight = rise / risers;
        let riserDiff = actualRiserHeight - desiredRiserHeight;

        let treads = risers - 1;
        if (treads < 1) treads = 1;

        let treadWidth, treadDiff, totalRun;
        if (run > 0) {
            treadWidth = run / treads;
            treadDiff = treadWidth - desiredTreadWidth;
            totalRun = run;
        } else {
            treadWidth = desiredTreadWidth;
            treadDiff = 0;
            totalRun = treads * treadWidth;
        }

        let stringerLength = Math.sqrt(Math.pow(rise, 2) + Math.pow(totalRun, 2));
        let inclineRad = Math.atan(rise / totalRun);
        let inclineDeg = inclineRad * (180 / Math.PI);

        let openingLength = (stairHeadroom + stairFloorThickness) / Math.tan(inclineRad);

        stairData = {
            riserHeight: actualRiserHeight,
            risers: risers,
            riserDiff: riserDiff,
            treadWidth: treadWidth,
            treads: treads,
            treadDiff: treadDiff,
            totalRun: totalRun,
            opening: openingLength,
            stringerLength: stringerLength,
            incline: inclineDeg
        };

        activeMode = "STAIR";
        stairStep = 0;
        showStairStep();
    }

    function showStairStep() {
        if (!stairData) return;
        let steps = [
            { label: "R-HT", value: `${formatVal(stairData.riserHeight)} mm` },
            { label: "RSRS", value: `${stairData.risers}` },
            { label: "R+/-", value: `${formatVal(stairData.riserDiff)} mm` },
            { label: "T-WD", value: `${formatVal(stairData.treadWidth)} mm` },
            { label: "TRDS", value: `${stairData.treads}` },
            { label: "T+/-", value: `${formatVal(stairData.treadDiff)} mm` },
            { label: "OPEN", value: `${formatVal(stairData.opening)} mm` },
            { label: "STRG", value: `${formatVal(stairData.stringerLength)} mm` },
            { label: "INCL", value: `${formatVal(stairData.incline)}°` }
        ];
        let step = steps[stairStep % steps.length];
        currentLabel = step.label;
        currentInput = step.value;
        stairStep++;
        isCalculatedState = true;
        updateDisplay();
    }

    function handleStairButton() {
        historyInput = "";
        if (isConvActive) {
            isConvActive = false;
            calcStairAuto(true);
        } else {
            if (stairData !== null && activeMode === "STAIR") {
                showStairStep();
            } else {
                calcStairAuto(false);
            }
        }
    }

    function storeVal() {
        isConvActive = false;
        historyInput = "";
        pendingStoreValue = parseValue(currentInput);
        awaitingStoreSlot = true;
        awaitingRecallSlot = false;
        currentLabel = "";
        currentInput = "STOR?";
        isCalculatedState = true;
        updateDisplay();
    }

    function recallVal() {
        isConvActive = false;
        historyInput = "";
        awaitingRecallSlot = true;
        awaitingStoreSlot = false;
        currentLabel = "";
        currentInput = "RCL?";
        isCalculatedState = true;
        updateDisplay();
    }

    function memPlus() {
        isConvActive = false;
        historyInput = "";
        memory += parseValue(currentInput);
        currentLabel = "M+";
        currentInput = `${formatVal(memory)}`;
        isCalculatedState = true;
        updateDisplay();
    }

    function calcSquare() {
        isConvActive = false;
        historyInput = "";
        let val = parseValue(currentInput);
        currentLabel = "x²";
        currentInput = formatVal(val * val);
        isCalculatedState = true;
        updateDisplay();
    }

    function parseInchesExpression(str) {
        if (!str) return 0;
        let s = str.trim();
        s = s.replace(/inch|in/gi, '').trim();
        s = s.replace(/\s+/g, ' ').trim();
        s = s.replace(/(\d+)\s+(\d+)\s*\/\s*(\d+)/g, "($1 + $2/$3)");
        s = s.replace(/(\d+)\s*\/\s*(\d+)/g, "($1/$2)");
        s = s.replace(/[^0-9+\-*/().\s]/g, '');
        if (!s) return 0;
        try {
            return Function('"use strict";return (' + s + ')')();
        } catch(e) {
            return 0;
        }
    }

    function calculateResult() {
        isConvActive = false;
        try {
            // 결과로 표시됐던 스택 분수 HTML이 섞여 있어도 안전하게 파싱되도록 순수 텍스트로 변환
            let cleanStr = stripDisplayHtml(currentInput).trim();
            let isArithmetic = /[+\-*/]/.test(cleanStr);

            if (isArithmetic) {
                historyInput = cleanStr + " =";
            } else {
                historyInput = "";
            }

            // mm/cm/m/yds/feet/inch 단위나 분수(예: "3/4")가 하나라도 섞여 있는지 확인
            let hasImperial = /ft\b|feet|inch|in\b/i.test(cleanStr) || /\d\s*\/\s*\d/.test(cleanStr);
            let hasMetric = /mm|cm|yds|\bm\b/i.test(cleanStr);
            let hasUnit = hasImperial || hasMetric;

            if (!hasUnit) {
                // 단위가 전혀 없는 순수 사칙연산은 기존과 동일하게 처리
                let parsable = cleanStr.replace(/[^0-9+\-*/().\s]/g, '');
                let res = Function('"use strict";return (' + parsable + ')')();
                currentLabel = "";
                if (Number.isFinite(res)) {
                    currentInput = formatVal(res);
                    // 단위 없는 순수 숫자도 이 계산기 내부 기준 단위인 mm로 취급해서
                    // 저장해두면, 이 값에 바로 Conv+단위를 눌렀을 때도 반올림 없이
                    // 정확하게 환산된다.
                    dimValueMM = res;
                } else {
                    currentInput = "Error";
                    dimValueMM = null;
                }
                isCalculatedState = true;
                updateDisplay();
                return;
            }

            // 단위가 섞여 있으면, 각 항을 mm 기준값으로 변환한 뒤 계산한다.
            // 이렇게 해야 "12mm + 2in 3/4" 처럼 서로 다른 단위끼리도 올바르게 더해진다.
            let resultMM;
            if (isArithmetic) {
                let tokens = cleanStr.split(/(\s[+\-*/]\s)/);
                let currentVal = 0;
                let currentOp = '+';
                let isFirstTerm = true;

                for (let i = 0; i < tokens.length; i++) {
                    let rawToken = tokens[i];
                    if (rawToken === undefined) continue;
                    let token = rawToken.trim();
                    if (!token) continue;

                    if (/^[+\-*/]$/.test(token)) {
                        currentOp = token;
                    } else {
                        let mmVal = parseUnitTermToMM(token);
                        if (isFirstTerm) {
                            currentVal = mmVal;
                            isFirstTerm = false;
                        } else {
                            if (currentOp === '+') currentVal += mmVal;
                            else if (currentOp === '-') currentVal -= mmVal;
                            else if (currentOp === '*') currentVal *= mmVal;
                            else if (currentOp === '/') currentVal /= mmVal;
                        }
                    }
                }
                resultMM = currentVal;
            } else {
                resultMM = parseUnitTermToMM(cleanStr);
            }

            currentLabel = "";
            if (!Number.isFinite(resultMM)) {
                currentInput = "Error";
                dimValueMM = null;
            } else if (hasImperial) {
                // feet/inch/분수가 하나라도 있었다면 결과는 ft/in(분수) 형태로 표시
                currentInput = mmToFeetDisplay(resultMM);
                // 화면엔 1/16인치로 반올림해서 보여주지만, 계산 당시의 정확한 mm값은
                // 따로 저장해둔다. 이렇게 해야 이 결과에 바로 Conv+단위(mm/inch/feet/yds
                // 어떤 단위로든)를 눌렀을 때, 반올림된 화면 표시가 아니라 이 정확한 값을
                // 기준으로 환산되어 오차가 누적되지 않는다.
                dimValueMM = resultMM;
            } else {
                // mm/cm/m/yds만 섞였다면 결과는 mm로 표시
                currentInput = `${formatVal(resultMM)}mm`;
                dimValueMM = resultMM;
            }
        } catch(e) {
            currentLabel = "";
            currentInput = "Error";
            dimValueMM = null;
        }
        isCalculatedState = true;
        updateDisplay();
    }
    

    // [추가] 버튼 누를 때 아이폰 키패드처럼 짧은 클릭음을 내어주는 함수
    function playClickSound() {
        try {
            const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            
            osc.type = 'sine';
            osc.frequency.setValueAtTime(800, audioCtx.currentTime);
            
            gain.gain.setValueAtTime(0.08, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.04);
            
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            
            osc.start();
            osc.stop(audioCtx.currentTime + 0.04);
        } catch(e) {}
    }

    // [수정] 모바일 터치 및 마우스 클릭 시 소리가 나도록 연결하는 코드
    document.addEventListener('DOMContentLoaded', () => {
        document.querySelectorAll('button').forEach(btn => {
            btn.addEventListener('touchstart', (e) => {
                e.preventDefault(); 
                playClickSound(); // <-- 모바일 터치할 때 소리 재생 추가
                btn.click();        
            }, { passive: false });
            
            // <-- 컴퓨터 마우스로 클릭할 때도 소리가 나도록 추가
            btn.addEventListener('click', () => {
                playClickSound();
            });
        });
    });
</script>
